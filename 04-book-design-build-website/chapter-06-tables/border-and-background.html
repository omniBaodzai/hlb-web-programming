<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Border and background table</title>
    </head>

    <body>
        <table border="1" bgcolor="#bafc03">
            <tr>
                <th scope="col" width="150"></th>
                <th scope="col">Withdrawn</th>
                <th scope="col">Credit</th>
                <th scope="col" width="150" bgcolor="#03e7fc">Balance</th>
            </tr>

            <tr>
                <th scope="row">January</th>
                <td>250.00</td>
                <td>660.50</td>
                <td bgcolor="#03e7fc">410.50</td>
            </tr>

            <tr>
                <th scope="row">February</th>
                <td>135.55</td>
                <td>895.20</td>
                <td bgcolor="#03e7fc">1170.15</td>
            </tr>
        </table>
    </body>
</html>
