<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Tables</title>
    </head>

    <body>
        <table border="1">
            <!-- Phần đầu bảng -->
            <thead>
                <tr>
                    <th></th>
                    <th scope="col">Home starter hosting</th>
                    <th scope="col">Premium business hosting</th>
                </tr>
            </thead>

            <!-- Phần thân bảng -->
            <tbody>
                <tr>
                    <th scope="row">Disk space</th>
                    <td>250mb</td>
                    <td>1gb</td>
                </tr>

                <tr>
                    <th scope="row">Bandwidth</th>
                    <td>5gb per month</td>
                    <td>50gb per month</td>
                </tr>
            </tbody>

            <!-- Phần chân bảng -->
            <tfoot>
                <tr>
                    <td></td>
                    <td colspan="2">Sign up now and save 10%!</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
