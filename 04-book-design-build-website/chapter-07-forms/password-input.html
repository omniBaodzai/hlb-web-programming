<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Password input form</title>
    </head>

    <body>
        <form action="https://www.example.com/login.php">
            <!-- Username -->
            <p>Username:
                <input type="text" name="username" size="15" maxlength="30" />
            </p>

            <!-- Password -->
            <p>Password:
                <input type="password" name="password" size="15" maxlength="30" />
            </p>
        </form>
    </body>
</html>
